[project]
name = "hybrid-dividend-portfolio"
version = "0.1.0"
description = "Auditable dividend portfolio scenario model with local evidence retrieval"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "pandas>=2.0",
]

[project.optional-dependencies]
optimizer = ["scipy>=1.10"]
dev = ["pytest>=7.0", "scipy>=1.10"]

[project.scripts]
dividend-portfolio = "dividend_portfolio.cli:main"
portfolio-rag = "dividend_portfolio.rag:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
